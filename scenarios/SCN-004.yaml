  - Command Execution
  - Host Status
  - Process Creation
  - Process Termination
  - Service Creation
  - Service Metadata
  - Service Modification
  - Windows Registry Key Modification
  trainee_tasks:
  - Identify Disable or Modify Tools (T1685) activity on ws01 from Cloud Service Modification, Command Execution,
