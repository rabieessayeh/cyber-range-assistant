id: SCN-003
title: Web application compromise to data exfiltration
version: '1.0'
attack_version: '19.2'
level: advanced
audience: purple-team
duration_minutes: 110
objectives:
- 'Jointly emulate and detect activity across: Initial Access, Execution, Persistence, Privilege Escalation, Collection,
  Command and Control, Exfiltration'
- Map each observed event to its ATT&CK technique (T1190, T1059.004, T1505.003, T1068, T1005, T1560.001, T1071.001,
  T1048)
tags:
- initial-access
- execution
- persistence
- privilege-escalation
- collection
- command-and-control
- exfiltration
- linux-web
environment:
  preset: linux-web
  segments:
  - name: internet
    hosts:
    - name: attacker
      os: Linux
      role: attacker
  - name: dmz
    hosts:
    - name: web01
      os: Linux
      role: web-server
  - name: backend
    hosts:
    - name: db01
      os: Linux
      role: database
  - name: soc
    hosts:
    - name: siem01
      os: Linux
      role: siem
steps:
- id: S1
  title: 'Initial Access: Exploit Public-Facing Application'
  tactic: initial-access
  technique: T1190
  description: 'The adversary emulation performs Exploit Public-Facing Application (T1190, Initial Access) against
    web01 (web-server, Linux). Planning level: the range operator selects an approved emulation from the range catalogue;
    no procedure is specified here.'
  target_host: web01
  duration_minutes: 10
  expected_detections:
  - Application Log Content
  - Module Load
  - Network Connection Creation
  - Network Traffic Content
  - Network Traffic Flow
  - Process Creation
  trainee_tasks:
  - 'Red cell: run the approved range-catalogue emulation of T1190 on web01; blue cell: detect it'
  - Compare expected telemetry (Application Log Content, Module Load, Network Connection Creation (+3 more)) with
    what the SIEM actually recorded
  - Agree on one detection gap for T1190 and tune or write an analytic
- id: S2
  title: 'Execution: Unix Shell'
  tactic: execution
  technique: T1059.004
  description: 'The adversary emulation performs Unix Shell (T1059.004, Execution) against web01 (web-server, Linux).
    Planning level: the range operator selects an approved emulation from the range catalogue; no procedure is specified
    here.'
  target_host: web01
  duration_minutes: 10
  expected_detections:
